<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicken Lotto</title>
<meta name="theme-color" content="#2B1555">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chicken Lotto">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* แถบบน (รอยบาก) สีม่วงหัวแอป, แถบล่างสีเดียวกับเมนูล่าง */
  body { background: linear-gradient(180deg, #45247D 0 50%, #FFF5EE 50% 100%); }
  iframe {
    position: fixed; border: 0; left: 0; right: 0;
    top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
    width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    background: #FBE7D8;
  }
  #splash {
    position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; text-align: center;
    color: #FFEEE3; font: 16px/1.5 system-ui, sans-serif;
    background: linear-gradient(165deg, #45247D 0%, #2B1555 100%); transition: opacity .3s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: min(230px, 56vw); height: auto; display: block; margin: 0 auto 18px; }
  .spin { width: 38px; height: 38px; margin: 0 auto 12px; border-radius: 50%;
    border: 4px solid rgba(255,238,227,.2); border-top-color: #F2620F; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="splash"><div><img src="logo.webp" alt="Chicken Lotto"><div class="spin"></div>กำลังเปิดแผงสลาก…</div></div>
<iframe id="app" title="Chicken Lotto" allow="clipboard-write"></iframe>
<script>
  /* ==== แก้แค่บรรทัดนี้ครั้งเดียว: วางลิงก์ Web app จาก Apps Script (ลงท้ายด้วย /exec) ==== */
  const APP_URL = 'https://script.google.com/macros/s/วางรหัสDeploymentตรงนี้/exec';

  /* หน้านี้ทำหน้าที่ 2 อย่าง: เป็นไอคอนบนหน้าจอโฮม และจำการเข้าระบบ (token) ไว้ให้แอป
     แอปจริงอยู่ใน Apps Script ทั้งหมด อัปเดตแอปไม่ต้องแก้ไฟล์นี้ */
  const KEY = 'chickenlotto.token';
  const FROM_APP = /^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/;   // หน้าแอปของ Apps Script
  const store = {
    get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
    set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
  };
  const splash = document.getElementById('splash');
  const hideSplash = () => splash.classList.add('hide');

  window.addEventListener('message', e => {
    if (!FROM_APP.test(e.origin)) return;
    const m = e.data || {};
    if (m.type === 'cl:hello') { e.source.postMessage({ type: 'cl:token', token: store.get() }, e.origin); hideSplash(); }
    else if (m.type === 'cl:save' && typeof m.token === 'string') store.set(m.token);
    else if (m.type === 'cl:clear') store.set('');
    else if (m.type === 'cl:ready') hideSplash();
  });
  document.getElementById('app').src = APP_URL;
  setTimeout(hideSplash, 15000); // กันค้างถ้าเน็ตช้ามาก
</script>
</body>
</html>
